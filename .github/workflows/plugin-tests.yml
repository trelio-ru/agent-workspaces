name: Plugin tests

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".githooks/**"
      - ".github/workflows/plugin-tests.yml"
      - "AGENTS.md"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "plugins/trelio-agent-workspaces/**"
      - "components/**"
      - "codex-hook-shell.lock.json"
      - "scripts/**"
      - "tests/**"
  push:
    branches:
      - main
    tags:
      - "v*"
      - "codex-hooks-source-v*"

permissions:
  contents: read

jobs:
  codex-tool-exposure:
    name: Codex same-thread tool exposure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pin the client that reproduces the session-static routing boundary.
      # All requests during the test go to synthetic loopback peers, without
      # OpenAI/Trelio authentication or a copied user model catalogue.
      - name: Install isolated Codex test client
        run: npm install --prefix "$RUNNER_TEMP/codex-schema-client" --no-audit --no-fund @openai/codex@0.163.0-alpha.11
      - name: Check model schemas after MCP reconnection
        run: python tests/codex-tool-exposure.py --codex-bin "$RUNNER_TEMP/codex-schema-client/node_modules/.bin/codex"

  git-main-guard:
    name: Canonical main Git guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run canonical main guard regressions
        run: npm run test:git-guard

  plugin-shell:
    name: Stable plugin shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      # The shell suite builds a synthetic signed package from the public ABI.
      # It therefore proves loader compatibility without copying runtime source
      # back into the plugin repository.
      - name: Run stable shell tests
        run: npm run test:plugin-shell

  codex-hook-update:
    name: Codex Windows update without restart or changed hook trust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned native Codex and exercise one existing owner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:RUNNER_TEMP 'human-codex-hook-update'
          New-Item -ItemType Directory -Path $native | Out-Null
          $inputs = @(
            @{ Name='codex-x86_64-pc-windows-msvc.exe'; Target='codex.exe'; Sha='90cf31818ddd8b29f956ad1df5f99af86c19296186be9a117d07b02b2c9bf0e8' },
            @{ Name='codex-code-mode-host-x86_64-pc-windows-msvc.exe'; Target='codex-code-mode-host.exe'; Sha='a17825919d06970ca739cdfd5e9c8040b1b0d33896e79db3980f96545ea1774e' }
          )
          foreach ($item in $inputs) {
            $archive = Join-Path $native ($item.Name + '.tar.gz')
            Invoke-WebRequest -Uri ('https://github.com/openai/codex/releases/download/rust-v0.164.0/' + $item.Name + '.tar.gz') -OutFile $archive -TimeoutSec 120
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.Sha) { throw 'Native Codex hash mismatch' }
            $members = @(& tar -tf $archive)
            if ($LASTEXITCODE -ne 0 -or $members.Count -ne 1 -or ($members[0] -ne $item.Name -and $members[0] -ne ('./' + $item.Name))) { throw 'Unexpected native archive' }
            & tar -xf $archive -C $native
            if ($LASTEXITCODE -ne 0) { throw 'Native extraction failed' }
            Move-Item (Join-Path $native $item.Name) (Join-Path $native $item.Target)
          }
          python tests/codex-hook-update.py --codex-bin (Join-Path $native 'codex.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Native same-owner hook update failed' }

  publish-codex-hooks:
    name: Publish or verify immutable Codex hook component
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/codex-hooks-source-v')
    needs: [plugin-shell, git-main-guard, codex-tool-exposure, codex-hook-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      # An explicitly approved component-source tag publishes before the first
      # hook-free main reaches the floating marketplace. Stable main tags only
      # verify that immutable ref. PR/main pushes never publish executables.
      - run: node scripts/build-codex-hook-component.mjs --check
      - run: node scripts/build-codex-hook-component.mjs --publish-release
