name: Plugin tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  node-tests:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the exact test paths explicit so both shells pass the same files
      # to Node without relying on glob expansion. Telegram Web's deterministic
      # runtime suite belongs in both POSIX lanes, including the injected exact
      # macOS `open -n -a <verified .app> URL` consent argv, landing-admission,
      # and terminal malformed-POST contracts. Real browser/account smoke is a
      # separately recorded release qualification and is not inferred from
      # these platform-neutral tests.
      - name: Run plugin and platform runtime Node tests
        run: >-
          node --test
          plugins/trelio-agent-workspaces/tests/trelio-git.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-messaging.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-remote-mcp.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-runtime-policy.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-workspace.test.mjs
          platform-skills/telegram-web/tests/trelio-telegram-web.test.mjs

  windows-acl:
    name: Windows runtime and private ACL
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runtime 1.0.4 rejects Windows before creating profile/state. Exercise
      # that real fail-closed gate plus pure parsing/environment/source
      # contracts here; do not inject the macOS lane and then weaken the real
      # Windows DACL verifier merely to run unreachable profile scenarios.
      # The complete deterministic behavior suite remains mandatory on both
      # POSIX runners above. A future Windows qualification must replace this
      # narrow gate with dedicated live task-tree and private-state coverage.
      - name: Run Telegram Web Windows gate regressions
        run: >-
          node --test
          --test-name-pattern="unqualified Linux and Windows hosts fail before doctor, bootstrap, or profile state|account slots use the strict canonical safe subset|browser and opener child environment is an allowlist|source contains exact security contracts"
          platform-skills/telegram-web/tests/trelio-telegram-web.test.mjs

      # The broader bridge suite contains POSIX-specific fixtures. This job is
      # intentionally narrow: it exercises the command transport and the real
      # Windows PowerShell Set-Acl/Get-Acl path that the other runners skip.
      - name: Run Windows ACL regressions
        run: >-
          node --test
          --test-name-pattern="Windows ACL command|Windows bridge applies|Windows Node resolver"
          plugins/trelio-agent-workspaces/tests/trelio-workspace.test.mjs

      # Git discovery is deliberately platform-aware even when Codex inherited
      # a stale PATH. Run both pure Windows-path cases and one real Git
      # init/add/commit smoke test on the Windows runner.
      - name: Run Windows Git prerequisite regressions
        run: >-
          node --test
          plugins/trelio-agent-workspaces/tests/trelio-git.test.mjs

      # GitHub's Windows runner account is an administrator. Re-run the real
      # bridge guard as a disposable standard user so an accidental dependency
      # on SeSecurityPrivilege or another elevated token right fails in CI.
      - name: Run Windows ACL regression as a standard user
        shell: pwsh
        run: ./.github/scripts/run-windows-acl-standard-user.ps1
