name: Plugin tests

on:
  pull_request:
    paths:
      - ".githooks/**"
      - ".gitignore"
      - ".github/scripts/run-windows-acl-standard-user.ps1"
      - ".github/workflows/plugin-tests.yml"
      - ".claude-plugin/**"
      - "AGENTS.md"
      - "package.json"
      - "plugins/trelio-agent-workspaces/**"
      - "scripts/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    # Path filtering applies to branch pushes. Plugin tags retain full release
    # verification. New provider tags are created in the private provider
    # repository; historical public provider tags remain immutable.
    paths:
      - ".githooks/**"
      - ".gitignore"
      - ".github/scripts/run-windows-acl-standard-user.ps1"
      - ".github/workflows/plugin-tests.yml"
      - ".claude-plugin/**"
      - "AGENTS.md"
      - "package.json"
      - "plugins/trelio-agent-workspaces/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  git-main-guard:
    name: Canonical main Git guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The test builds a disposable bare remote plus linked worktrees and
      # proves that raw protected pushes fail while the guarded path keeps the
      # canonical checkout, origin/main and stable release tag exact.
      - name: Run canonical main guard regressions
        run: bash scripts/git-main-guard.test.sh

  node-tests:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep exact paths explicit so every shell passes the same generic host
      # files to Node. Provider source and CI live in the private backend/provider
      # contour and cannot become public plugin release inputs again.
      - name: Run generic plugin host Node tests
        run: >-
          node --test
          plugins/trelio-agent-workspaces/tests/trelio-git.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-remote-mcp.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-runtime-policy.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-runtime-session.test.mjs
          plugins/trelio-agent-workspaces/tests/trelio-workspace.test.mjs

  windows-acl:
    name: Windows runtime and private ACL
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The broader bridge suite contains POSIX-specific fixtures. This job is
      # intentionally narrow: it exercises the command transport and the real
      # Windows PowerShell Set-Acl/Get-Acl path that the other runners skip.
      - name: Run Windows ACL regressions
        run: >-
          node --test
          --test-name-pattern="Windows ACL command|Windows bridge applies|Windows Node resolver|Windows Remote MCP launcher"
          plugins/trelio-agent-workspaces/tests/trelio-workspace.test.mjs

      # Git discovery is deliberately platform-aware even when Codex inherited
      # a stale PATH. Run both pure Windows-path cases and one real Git
      # init/add/commit smoke test on the Windows runner.
      - name: Run Windows Git prerequisite regressions
        run: >-
          node --test
          plugins/trelio-agent-workspaces/tests/trelio-git.test.mjs

      # GitHub's Windows runner account is an administrator. Re-run the real
      # bridge guard as a disposable standard user so an accidental dependency
      # on SeSecurityPrivilege or another elevated token right fails in CI.
      - name: Run Windows ACL regression as a standard user
        shell: pwsh
        run: ./.github/scripts/run-windows-acl-standard-user.ps1
