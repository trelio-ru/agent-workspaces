name: Plugin tests

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".claude-plugin/**"
      - ".githooks/**"
      - ".github/workflows/plugin-tests.yml"
      - "AGENTS.md"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "plugins/trelio-agent-workspaces/**"
      - "scripts/**"
      - "tests/**"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  git-main-guard:
    name: Canonical main Git guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run canonical main guard regressions
        run: bash scripts/git-main-guard.test.sh

  plugin-shell:
    name: Stable plugin shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      # The shell suite builds a synthetic signed package from the public ABI.
      # It therefore proves loader compatibility without copying runtime source
      # back into the plugin repository.
      - name: Run stable shell tests
        run: npm run test:plugin-shell
